name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android 35 platform & build-tools
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run unit & codec tests
        run: npm test

      - name: Build web bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare Android signing config
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/jiuji-release.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            {
              echo "mode=release"
              echo "keystore_path=$KEYSTORE_PATH"
              echo "apk_file=Jiuji-AnkiForge-release.apk"
              echo "artifact_name=Jiuji-AnkiForge-release-apk"
            } >> "$GITHUB_OUTPUT"
            echo "Release signing configured for alias: $ANDROID_KEY_ALIAS"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$GITHUB_REPOSITORY" = "nonuiucode/anki-forge-app" ]; then
              echo "::error::Release tag $GITHUB_REF requires ANDROID_KEYSTORE_* secrets to build a signed APK."
              exit 1
            fi
            {
              echo "mode=debug"
              echo "keystore_path="
              echo "apk_file=Jiuji-AnkiForge-debug.apk"
              echo "artifact_name=Jiuji-AnkiForge-debug-apk"
            } >> "$GITHUB_OUTPUT"
            echo "Signing secrets unavailable; falling back to debug APK."
          fi

      - name: Build signed Release APK
        if: steps.signing.outputs.mode == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Jiuji-AnkiForge-release.apk
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs ../Jiuji-AnkiForge-release.apk

      - name: Build debug APK (fallback when signing secrets absent)
        if: steps.signing.outputs.mode != 'release'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Jiuji-AnkiForge-debug.apk

      - name: Clean up temporary signing keystore
        if: always() && steps.signing.outputs.keystore_path != ''
        run: rm -f "${{ steps.signing.outputs.keystore_path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact_name }}
          path: ${{ steps.signing.outputs.apk_file }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.signing.outputs.apk_file }}
